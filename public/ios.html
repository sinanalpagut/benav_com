<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bêje — App Store</title>
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<script>(function(){try{var t=localStorage.getItem('benav-theme');if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');
  :root{
    --font:'Mulish',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --bg:#f7f6f3; --surface:#ffffff; --text:#1c1b18; --text-soft:#51504a;
    --border:#e7e4dd; --accent:#1e3a5f; --accent-2:#2c5180; --accent-ink:#ffffff;
    --shadow-lg:0 18px 40px -16px rgba(20,30,50,.20), 0 4px 12px rgba(28,27,24,.06);
    --radius-lg:22px;
  }
  [data-theme="dark"]{
    --bg:#121316; --surface:#1b1d22; --text:#f2f1ee; --text-soft:#b7b5ad;
    --border:#2a2c31; --accent:#5b8bd6; --accent-2:#4a76b8; --accent-ink:#0c0d0f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:var(--font);
    padding:32px 20px;
  }
  .card{
    max-width:380px; width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:36px 28px;
    text-align:center;
  }
  img{width:72px; height:72px; border-radius:18px; box-shadow:0 4px 14px rgba(0,0,0,.15); margin-bottom:16px;}
  h1{font-size:19px; font-weight:800; margin:0 0 20px;}

  .steps{
    text-align:left; background:var(--accent-tint,rgba(30,58,95,.06)); border:1px solid var(--border);
    border-radius:16px; padding:18px 18px 18px 16px; margin-bottom:20px;
  }
  [data-theme="dark"] .steps{ background:rgba(91,139,214,.10); }
  .steps p{ margin:0 0 10px; font-size:13px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:.02em; }
  .steps ol{ margin:0; padding-left:20px; font-size:15px; line-height:1.6; }
  .steps li{ margin-bottom:6px; }
  .steps li:last-child{ margin-bottom:0; }
  .steps b{ font-size:17px; }

  a.btn, button.btn{
    display:block; width:100%; text-decoration:none; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:15px; padding:14px 18px; border-radius:14px;
    transition:opacity .15s; border:none; cursor:pointer; font-family:inherit;
  }
  a.btn:active, button.btn:active{opacity:.8}
  .secondary{
    margin-top:10px; background:transparent; color:var(--accent);
    border:1px solid var(--border);
  }
  .note{margin-top:16px; font-size:12px; color:var(--text-soft); opacity:.75; line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/beje.png" alt="Bêje">
    <h1>Bêje: Kürtçe Öğren</h1>

    <div class="steps">
      <p>Instagram bu bağlantıyı doğrudan açamıyor</p>
      <ol>
        <li>Sağ üstteki <b>•••</b> simgesine dokun</li>
        <li>"Tarayıcıda Aç" / "Safari'de Aç"ı seç</li>
        <li>Açılan Safari'de App Store kendiliğinden çıkar</li>
      </ol>
    </div>

    <a class="btn" href="https://apps.apple.com/tr/app/id6780462851" target="_blank" rel="noopener noreferrer">App Store'da Aç (dene)</a>
    <button class="btn secondary" id="copyBtn" type="button">Bağlantıyı Kopyala</button>
    <div class="note" id="copyNote">Kopyaladıktan sonra Safari'yi aç ve adres çubuğuna yapıştır.</div>
  </div>
  <script>
    var btn = document.getElementById('copyBtn');
    var note = document.getElementById('copyNote');
    var link = 'https://apps.apple.com/tr/app/id6780462851';
    btn.addEventListener('click', function () {
      function fallback() {
        var ta = document.createElement('textarea');
        ta.value = link; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
      }
      function done() {
        note.textContent = 'Kopyalandı ✓ — Safari\'yi aç ve yapıştır.';
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done, function () { fallback(); done(); });
      } else {
        fallback(); done();
      }
    });
  </script>
</body>
</html>
